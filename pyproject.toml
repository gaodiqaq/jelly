[project]
name = "agent-shell"
version = "0.1.0"
description = "Jelly, a local-first AI agent workspace powered by LiteLLM"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["agent", "ai", "llm", "litellm", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "litellm>=1.55.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "hatchling>=1.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
agent = "agent_shell.main:app"

[project.urls]
Homepage = "https://github.com/gaodiqaq/jelly"
Repository = "https://github.com/gaodiqaq/jelly"
Issues = "https://github.com/gaodiqaq/jelly/issues"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_shell"]

[tool.hatch.build.targets.wheel.force-include]
"webui/dist" = "agent_shell/webui"

[tool.hatch.build.targets.sdist.force-include]
"webui/dist" = "webui/dist"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", "*.egg-info", "scratch", "chinese-novelist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
