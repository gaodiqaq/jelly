<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>贪吃蛇小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            color: #fff;
        }

        .game-container {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2em;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .score {
            font-size: 1.2em;
            font-weight: bold;
        }

        .score span {
            color: #00d2ff;
            font-size: 1.4em;
        }

        .best-score {
            font-size: 1em;
            color: #ffd700;
        }

        .best-score span {
            font-size: 1.2em;
        }

        canvas {
            border: 3px solid #3a7bd5;
            border-radius: 10px;
            background: #0a0a1a;
            box-shadow: 0 0 20px rgba(58, 123, 213, 0.3);
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 25px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-start {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
        }

        .btn-pause {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
        }

        .btn-speed {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .tips {
            margin-top: 15px;
            font-size: 0.9em;
            color: #aaa;
        }

        .tips kbd {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .game-over-overlay.show {
            display: flex;
        }

        .game-over-box {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #3a7bd5;
            box-shadow: 0 0 40px rgba(58, 123, 213, 0.5);
        }

        .game-over-box h2 {
            font-size: 2em;
            color: #f5576c;
            margin-bottom: 20px;
        }

        .game-over-box p {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .game-over-box .final-score {
            font-size: 2.5em;
            color: #00d2ff;
            font-weight: bold;
            margin: 15px 0;
        }

        .game-over-box button {
            margin-top: 20px;
            padding: 12px 40px;
            font-size: 1.1em;
        }

        /* 移动端虚拟方向键 */
        .mobile-controls {
            display: none;
            margin-top: 20px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
            justify-content: center;
        }

        .d-pad button {
            width: 60px;
            height: 60px;
            padding: 0;
            font-size: 1.5em;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .d-pad .up { grid-column: 2; grid-row: 1; }
        .d-pad .left { grid-column: 1; grid-row: 2; }
        .d-pad .right { grid-column: 3; grid-row: 2; }
        .d-pad .down { grid-column: 2; grid-row: 3; }

        @media (max-width: 600px) {
            .mobile-controls {
                display: block;
            }
            canvas {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇</h1>
        <div class="info-bar">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="best-score">🏆 最高: <span id="best-score">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="startGame()">开始游戏</button>
            <button class="btn-pause" id="pauseBtn" onclick="togglePause()" disabled>暂停</button>
            <button class="btn-speed" id="speedBtn" onclick="changeSpeed()">速度: 正常</button>
        </div>
        <div class="tips">
            <p>使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向 | <kbd>空格</kbd> 暂停</p>
        </div>
        <div class="mobile-controls">
            <div class="d-pad">
                <button class="up" onclick="setDirection('up')">↑</button>
                <button class="left" onclick="setDirection('left')">←</button>
                <button class="right" onclick="setDirection('right')">→</button>
                <button class="down" onclick="setDirection('down')">↓</button>
            </div>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-box">
            <h2>💀 游戏结束</h2>
            <p>你的得分</p>
            <div class="final-score" id="finalScore">0</div>
            <p id="newRecord" style="color: #ffd700; display: none;">🎉 新纪录！</p>
            <button class="btn-start" onclick="restartGame()">再来一局</button>
        </div>
    </div>

    <script>
        // 游戏配置
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // 游戏状态
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('snakeBestScore')) || 0;
        let gameLoop = null;
        let isRunning = false;
        let isPaused = false;
        let speed = 150; // 毫秒/帧
        let speedLevel = 1; // 0:慢, 1:正常, 2:快

        const speeds = [
            { name: '慢速', ms: 200 },
            { name: '正常', ms: 150 },
            { name: '快速', ms: 100 },
            { name: '极速', ms: 60 }
        ];

        // 初始化
        document.getElementById('best-score').textContent = bestScore;

        function initGame() {
            // 初始化蛇（3节，在中间位置）
            snake = [
                { x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) },
                { x: Math.floor(tileCount / 2) - 1, y: Math.floor(tileCount / 2) },
                { x: Math.floor(tileCount / 2) - 2, y: Math.floor(tileCount / 2) }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            document.getElementById('score').textContent = score;
            generateFood();
        }

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
            food = newFood;
        }

        function draw() {
            // 清空画布
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制网格（淡淡的）
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 绘制食物
            const foodX = food.x * gridSize;
            const foodY = food.y * gridSize;
            
            // 食物光晕
            const gradient = ctx.createRadialGradient(
                foodX + gridSize / 2, foodY + gridSize / 2, 2,
                foodX + gridSize / 2, foodY + gridSize / 2, gridSize
            );
            gradient.addColorStop(0, 'rgba(255, 50, 50, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 50, 50, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(foodX - 5, foodY - 5, gridSize + 10, gridSize + 10);

            // 食物本体
            ctx.fillStyle = '#ff3232';
            ctx.shadowColor = '#ff3232';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(foodX + gridSize / 2, foodY + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 绘制蛇
            snake.forEach((segment, index) => {
                const x = segment.x * gridSize;
                const y = segment.y * gridSize;

                if (index === 0) {
                    // 蛇头
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 15;
                } else {
                    // 蛇身 - 渐变效果
                    const alpha = 1 - (index / snake.length) * 0.5;
                    ctx.fillStyle = `rgba(0, 210, 150, ${alpha})`;
                    ctx.shadowBlur = 0;
                }

                // 圆角矩形
                const radius = 5;
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + gridSize - radius, y);
                ctx.quadraticCurveTo(x + gridSize, y, x + gridSize, y + radius);
                ctx.lineTo(x + gridSize, y + gridSize - radius);
                ctx.quadraticCurveTo(x + gridSize, y + gridSize, x + gridSize - radius, y + gridSize);
                ctx.lineTo(x + radius, y + gridSize);
                ctx.quadraticCurveTo(x, y + gridSize, x, y + gridSize - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;

                // 蛇头画眼睛
                if (index === 0) {
                    ctx.fillStyle = '#fff';
                    let eyeX1, eyeY1, eyeX2, eyeY2;
                    
                    if (direction.x === 1) { // 右
                        eyeX1 = x + 14; eyeY1 = y + 5;
                        eyeX2 = x + 14; eyeY2 = y + 13;
                    } else if (direction.x === -1) { // 左
                        eyeX1 = x + 5; eyeY1 = y + 5;
                        eyeX2 = x + 5; eyeY2 = y + 13;
                    } else if (direction.y === -1) { // 上
                        eyeX1 = x + 5; eyeY1 = y + 5;
                        eyeX2 = x + 13; eyeY2 = y + 5;
                    } else { // 下
                        eyeX1 = x + 5; eyeY1 = y + 14;
                        eyeX2 = x + 13; eyeY2 = y + 14;
                    }
                    
                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 2.5, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function update() {
            if (isPaused) return;

            // 更新方向
            direction = { ...nextDirection };

            // 计算新蛇头位置
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // 碰撞检测 - 撞墙
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // 碰撞检测 - 撞自己
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }

            // 移动蛇
            snake.unshift(head);

            // 检测是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                generateFood();
            } else {
                snake.pop(); // 没吃到食物，移除尾部
            }

            draw();
        }

        function startGame() {
            if (isRunning) return;
            
            initGame();
            isRunning = true;
            isPaused = false;
            
            document.getElementById('startBtn').textContent = '游戏中...';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            
            draw();
            gameLoop = setInterval(update, speed);
        }

        function togglePause() {
            if (!isRunning) return;
            
            isPaused = !isPaused;
            document.getElementById('pauseBtn').textContent = isPaused ? '继续' : '暂停';
            
            if (isPaused) {
                // 绘制暂停提示
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 30px Microsoft YaHei';
                ctx.textAlign = 'center';
                ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
                ctx.font = '16px Microsoft YaHei';
                ctx.fillText('按空格键继续', canvas.width / 2, canvas.height / 2 + 35);
            }
        }

        function changeSpeed() {
            speedLevel = (speedLevel + 1) % speeds.length;
            speed = speeds[speedLevel].ms;
            document.getElementById('speedBtn').textContent = `速度: ${speeds[speedLevel].name}`;
            
            if (isRunning && !isPaused) {
                clearInterval(gameLoop);
                gameLoop = setInterval(update, speed);
            }
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameLoop);
            
            // 更新最高分
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snakeBestScore', bestScore);
                document.getElementById('best-score').textContent = bestScore;
                document.getElementById('newRecord').style.display = 'block';
            } else {
                document.getElementById('newRecord').style.display = 'none';
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverOverlay').classList.add('show');
            
            document.getElementById('startBtn').textContent = '开始游戏';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('pauseBtn').textContent = '暂停';
        }

        function restartGame() {
            document.getElementById('gameOverOverlay').classList.remove('show');
            startGame();
        }

        function setDirection(dir) {
            switch (dir) {
                case 'up':
                    if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
                    break;
                case 'down':
                    if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
                    break;
                case 'left':
                    if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
                    break;
                case 'right':
                    if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
                    break;
            }
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    setDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    setDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    setDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    setDirection('right');
                    break;
                case ' ':
                    e.preventDefault();
                    if (isRunning) togglePause();
                    break;
                case 'Enter':
                    if (!isRunning) startGame();
                    break;
            }
        });

        // 初始绘制
        initGame();
        draw();
    </script>
</body>
</html>
