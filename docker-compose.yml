services:
  agent-shell:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGENT_WEB_TOKEN: ${AGENT_WEB_TOKEN:?请设置 AGENT_WEB_TOKEN 环境变量}
      AGENT_MODEL: ${AGENT_MODEL:-dashscope/qwen-plus}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请设置 DASHSCOPE_API_KEY}
    volumes:
      - ./workspace:/workspace
      - ./sessions:/root/.agent_shell/sessions
    restart: unless-stopped
