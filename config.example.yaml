# agent-shell 示例配置
# 复制为 agent_shell.yaml（项目根目录）或 ~/.agent_shell/config.yaml 后按需修改
# 命令行参数 / 环境变量（AGENT_*）优先级高于此文件

model: "openai/gpt-4o-mini"        # litellm 格式模型名，必须带提供商前缀

max_turns: 60                      # 单轮对话中最大工具调用轮次

api:
  temperature: 0.2
  max_tokens: 8192                 # 设为 null 使用提供商默认值
  timeout: 120                     # 单次请求超时（秒）

permissions:
  default: "ask"                   # ask / auto / deny
  auto_approve_read_only: true     # 只读工具（read/ls/glob/grep 等）免审批

context:
  max_chars: 120000                # 上下文窗口估算上限，超出后从最旧消息裁剪

tools:
  bash_timeout: 120                # bash 工具默认超时（秒）
  max_output_chars: 30000          # 工具输出截断上限（字符）

system_prompt: null                # 自定义系统提示词，null 使用内置默认
