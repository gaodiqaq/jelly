<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小鸟飞飞</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            touch-action: none;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            z-index: 10;
        }

        #gameOverScreen {
            display: none;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.5em;
            background: #FFD700;
            border: none;
            border-radius: 10px;
            color: #333;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #score {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 5;
            font-weight: bold;
        }

        .info {
            font-size: 1.2em;
            margin: 10px;
            text-align: center;
        }

        .final-score {
            font-size: 2em;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="score">0</div>
    
    <div id="startScreen">
        <h1>🐦 小鸟飞飞</h1>
        <p class="info">点击屏幕让小鸟跳跃</p>
        <p class="info">躲避管道，飞得更远！</p>
        <button class="btn" onclick="startGame()">开始游戏</button>
    </div>
    
    <div id="gameOverScreen">
        <h1>游戏结束</h1>
        <div class="final-score">得分: <span id="finalScore">0</span></div>
        <div class="final-score">最高分: <span id="bestScore">0</span></div>
        <button class="btn" onclick="restartGame()">再玩一次</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const bestScoreDisplay = document.getElementById('bestScore');

        // 设置画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 游戏变量
        let bird, pipes, score, bestScore, gameRunning, gameLoop;
        const gravity = 0.5;
        const jumpPower = -8;
        const pipeWidth = 60;
        const pipeGap = 180;
        const pipeSpeed = 3;

        // 初始化游戏
        function initGame() {
            bird = {
                x: canvas.width * 0.3,
                y: canvas.height / 2,
                width: 34,
                height: 24,
                velocity: 0,
                rotation: 0
            };
            pipes = [];
            score = 0;
            scoreDisplay.textContent = score;
            gameRunning = false;
            
            // 读取最高分
            bestScore = localStorage.getItem('birdGameBestScore') || 0;
        }

        // 开始游戏
        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            initGame();
            gameRunning = true;
            gameLoop = requestAnimationFrame(update);
        }

        // 重新开始
        function restartGame() {
            startGame();
        }

        // 小鸟跳跃
        function jump() {
            if (gameRunning) {
                bird.velocity = jumpPower;
            }
        }

        // 创建管道
        function createPipe() {
            const minHeight = 50;
            const maxHeight = canvas.height - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight)) + minHeight;
            
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                scored: false
            });
        }

        // 更新游戏
        function update() {
            if (!gameRunning) return;

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景
            drawBackground();

            // 更新小鸟
            bird.velocity += gravity;
            bird.y += bird.velocity;
            bird.rotation = Math.min(Math.max(bird.velocity * 3, -30), 90);

            // 绘制小鸟
            drawBird();

            // 生成管道
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 250) {
                createPipe();
            }

            // 更新和绘制管道
            for (let i = pipes.length - 1; i >= 0; i--) {
                const pipe = pipes[i];
                pipe.x -= pipeSpeed;

                // 绘制管道
                drawPipe(pipe);

                // 检测碰撞
                if (checkCollision(pipe)) {
                    endGame();
                    return;
                }

                // 计分
                if (!pipe.scored && pipe.x + pipeWidth < bird.x) {
                    pipe.scored = true;
                    score++;
                    scoreDisplay.textContent = score;
                }

                // 移除屏幕外的管道
                if (pipe.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }

            // 检测边界
            if (bird.y + bird.height > canvas.height || bird.y < 0) {
                endGame();
                return;
            }

            gameLoop = requestAnimationFrame(update);
        }

        // 绘制背景
        function drawBackground() {
            // 天空渐变
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 地面
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 25, canvas.width, 5);
        }

        // 绘制小鸟
        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(bird.rotation * Math.PI / 180);

            // 身体
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(8, -5, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(10, -5, 3, 0, Math.PI * 2);
            ctx.fill();

            // 嘴巴
            ctx.fillStyle = '#FF6347';
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(22, -2);
            ctx.lineTo(22, 2);
            ctx.closePath();
            ctx.fill();

            // 翅膀
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.ellipse(-5, 5, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // 绘制管道
        function drawPipe(pipe) {
            // 上管道
            const gradient1 = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
            gradient1.addColorStop(0, '#2E8B57');
            gradient1.addColorStop(0.5, '#3CB371');
            gradient1.addColorStop(1, '#2E8B57');
            ctx.fillStyle = gradient1;
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            
            // 上管道边缘
            ctx.fillStyle = '#228B22';
            ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);

            // 下管道
            ctx.fillStyle = gradient1;
            ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);
            
            // 下管道边缘
            ctx.fillStyle = '#228B22';
            ctx.fillRect(pipe.x - 5, pipe.bottomY, pipeWidth + 10, 20);
        }

        // 碰撞检测
        function checkCollision(pipe) {
            // 检测是否穿过管道间隙
            if (bird.x + bird.width > pipe.x && bird.x < pipe.x + pipeWidth) {
                if (bird.y < pipe.topHeight || bird.y + bird.height > pipe.bottomY) {
                    return true;
                }
            }
            return false;
        }

        // 结束游戏
        function endGame() {
            gameRunning = false;
            cancelAnimationFrame(gameLoop);
            
            // 更新最高分
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('birdGameBestScore', bestScore);
            }
            
            finalScoreDisplay.textContent = score;
            bestScoreDisplay.textContent = bestScore;
            gameOverScreen.style.display = 'flex';
        }

        // 事件监听
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            jump();
        });

        // 初始化
        initGame();
    </script>
</body>
</html>
